# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  workflow_run:
    workflows: ["R-CMD-check"]
    types:
      - completed
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    container: plger/scdblfinder:latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install rsync 📚
        run: apt-get update && apt-get install -y rsync

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install pkgdown and local package
        run: |
          if (!requireNamespace("pkgdown", quietly = TRUE)) install.packages("pkgdown")
          # Remotes/devtools or standard install to ensure local package metadata is loaded
          remotes::install_local(".", upgrade = "never", dependencies = FALSE)
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.4.1
        with:
          clean: false
          branch: gh-pages
          folder: docs
